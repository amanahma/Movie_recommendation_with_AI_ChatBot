# Alembic configuration.
#
# The actual database URL is NOT hard-coded here -- it's pulled from our
# app settings (and thus the .env file) inside alembic/env.py. That keeps
# a single source of truth for the connection string.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used when generating new revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files (UTC is a safe default).
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
